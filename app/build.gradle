plugins {
    id "com.android.application"
}

def pimeCoreDir = new File(project.findProperty("pimeCoreDir")
        ?: new File(rootProject.projectDir.parentFile, "pime-core").absolutePath)
def speechPluginDir = new File(project.findProperty("speechPluginDir")
        ?: new File(rootProject.projectDir.parentFile,
                "pime-public-plugin/plugins/recognize/pime-speech-sherpa").absolutePath)

/* Release signing secrets live outside the repository (git-ignored
 * keystore.properties + keystore). Without them the release build stays
 * unsigned instead of failing, so ordinary "assembleRelease" checking still
 * works on a clean checkout. */
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.isFile()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def hasReleaseKeystore = keystorePropertiesFile.isFile()
        && rootProject.file(keystoreProperties.getProperty("storeFile", "")).isFile()

android {
    namespace "com.pimeorg.pime"
    compileSdk 36
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.pimeorg.pime"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }

        externalNativeBuild {
            cmake {
                arguments "-DPIME_CORE_DIR=" + pimeCoreDir.absolutePath,
                        "-DPIME_SPEECH_PLUGIN_DIR=" + speechPluginDir.absolutePath
                cppFlags "-std=c++20"
            }
        }
    }

    /* Extract JNI libraries: the native speech plugin is copied out of
     * nativeLibraryDir into its plugin package at first run, and it loads
     * libsherpa-onnx-c-api.so / libonnxruntime.so from the same directory. */
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.31.6"
        }
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile rootProject.file(keystoreProperties.getProperty("storeFile"))
                storePassword keystoreProperties.getProperty("storePassword")
                keyAlias keystoreProperties.getProperty("keyAlias")
                keyPassword keystoreProperties.getProperty("keyPassword")
                /* v1 is still needed on API 24/25 (minSdk 24); v2/v3 stay on
                 * for everything newer. */
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            if (hasReleaseKeystore) signingConfig signingConfigs.release
            /* R8 shrinks and obfuscates the Java shell; the JNI symbol names
             * are pinned in proguard-rules.pro. */
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"),
                    "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.transition:transition:1.5.0"
    implementation "com.google.android.material:material:1.12.0"
    /* bzip2 + tar for the pinned speech-model archive. */
    implementation "org.apache.commons:commons-compress:1.26.2"

    testImplementation "junit:junit:4.13.2"
}

/*
 * Bundled plugin packages are copied from the first-party build output as whole
 * directories. A manifest declares the data files a plugin needs; shipping the
 * package without them makes a fail-closed plugin return PIME_NOT_FOUND and
 * aborts the whole chain, so catch that at build time instead of on a device.
 */
tasks.register("checkBundledPluginAssets") {
    group = "verification"
    description = "Verifies every bundled plugin package ships the assets its manifest declares."
    doLast {
        def plugins = file("src/main/assets/plugins")
        def missing = []
        if (plugins.isDirectory()) {
            plugins.eachDir { pkg ->
                def manifest = new File(pkg, "manifest.yaml")
                if (!manifest.isFile()) return
                def matcher = manifest.getText("UTF-8") =~ /(?m)^assets:\s*\[([^\]]*)\]/
                if (!matcher.find()) return
                matcher.group(1).split(",").each { entry ->
                    def name = entry.trim()
                    if (name && !new File(new File(pkg, "assets"), name).isFile()) {
                        missing << "${pkg.name}/assets/${name}"
                    }
                }
            }
        }
        if (!missing.isEmpty()) {
            throw new GradleException(
                    "Bundled plugin manifests declare missing assets:\n  "
                    + missing.join("\n  "))
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn tasks.named("checkBundledPluginAssets")
}
